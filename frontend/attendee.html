<!doctype html>

<!--
    attendee.html
    The page an attendee uses to get a ticket.

    Flow:
    1. The attendee chooses an event from the list.
    2. The attendee pastes a public wallet address, or
       generates a test wallet.
    3. The page asks the server for a ticket.
    4. The page shows a QR code to scan at the door.

    The logic is in attendee.js.
-->

<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Get your event ticket</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="attendee-page">

    <header class="site-header">
        <a class="brand" href="organizer.html"><span class="brand-mark" aria-hidden="true">S</span>Solana Tickets</a>
        <nav aria-label="Main navigation">
            <a href="organizer.html">Organizer</a>
            <a href="attendee.html" aria-current="page">Attendee</a>
            <a href="scanner.html">Scanner</a>
        </nav>
    </header>

    <main>
        <div class="attendee-layout">

            <section class="event-intro" aria-labelledby="event-name">
                <!--
                    A script replaces "Loading event..." with the
                    real event name.
                -->
                <h1 id="event-name">Loading event...</h1>

                <!-- A script fills in the date and spots left. -->
                <p id="event-details"></p>
            </section>

            <section class="panel" aria-labelledby="reserve-heading">
                <h2 id="reserve-heading">Get your ticket</h2>
                <p class="helper">Choose an event, then enter your public wallet address.</p>

                <p class="label">Available events</p>
                <!--
                    A script fills this list with the events from
                    the server. Each one is a button to choose it.
                -->
                <ul id="event-list" class="event-list"></ul>

                <form id="ticket-form">
                    <label for="wallet">Public wallet address</label>
                    <input
                        id="wallet"
                        name="wallet"
                        type="text"
                        required
                        autocomplete="off"
                        autocapitalize="none"
                        spellcheck="false"
                        placeholder="Paste your Solana wallet address"
                        aria-describedby="wallet-help"
                    >
                    <small id="wallet-help">Use your public address only. Never enter a secret key or recovery phrase.</small>

                    <button id="generate-wallet" class="secondary" type="button">Generate test wallet</button>

                    <!--
                        Starts disabled. A script enables it once
                        the event has loaded.
                    -->
                    <button id="get-ticket" type="submit" disabled>Get ticket</button>
                </form>

                <!--
                    Success and error text shows here.
                    Hidden while empty.
                -->
                <p id="message" role="status" aria-live="polite"></p>

                <!-- Hidden until a ticket has been issued. -->
                <section id="ticket" aria-labelledby="ticket-heading" hidden>
                    <h2 id="ticket-heading">Your ticket</h2>

                    <!-- The QR code library draws the code here. -->
                    <div id="qr" role="img" aria-label="Ticket QR code"></div>

                    <p id="ticket-event"></p>
                    <p id="ticket-wallet" class="wallet"></p>

                    <small>Show this code at the entrance.</small>
                </section>
            </section>

        </div>
    </main>

    <!--
        QR code library, loaded from the internet. It draws
        the code into #qr.
    -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!--
        Solana web3 library, loaded from the internet. It makes
        the test wallet when the button is pressed.
    -->
    <script src="https://cdn.jsdelivr.net/npm/@solana/web3.js@1.98.0/lib/index.iife.min.js"></script>

    <script src="attendee.js"></script>
</body>
</html>
